<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6E1F30" />
      <stop offset="65%" stop-color="#420F1B" />
      <stop offset="100%" stop-color="#22050B" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D0" />
      <stop offset="25%" stop-color="#D4A054" />
      <stop offset="65%" stop-color="#F3DCAB" />
      <stop offset="100%" stop-color="#9B6C26" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Circle with Royal Burgundy Background -->
  <circle cx="64" cy="64" r="61" fill="url(#bgGrad)" />

  <!-- Outer Gold Border -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner Dotted Gold Circle -->
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2.5,2" opacity="0.85" />

  <!-- Top Auspicious Star / Diamond -->
  <path d="M64 22 L65.5 27 L70.5 28.5 L65.5 30 L64 35 L62.5 30 L57.5 28.5 L62.5 27 Z" fill="url(#goldGrad)" />

  <!-- Monogram M & N -->
  <text x="36" y="74" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">M</text>
  <text x="92" y="74" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">N</text>

  <!-- Romantic Heart in Center -->
  <path d="M64 54 C60.5 48 54 48 54 54.5 C54 61.5 64 69.5 64 69.5 C64 69.5 74 61.5 74 54.5 C74 48 67.5 48 64 54 Z" fill="url(#goldGrad)" />

  <!-- Date at Bottom -->
  <text x="64" y="96" font-family="'Cinzel', Georgia, serif" font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#E8CE9D" text-anchor="middle">16·11·26</text>
</svg>
